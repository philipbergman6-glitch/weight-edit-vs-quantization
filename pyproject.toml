[project]
name = "weight-edit-vs-quantization"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=0.26",
    "math-verify==0.9.0",
    "numpy>=2.5.4",
    "safetensors>=0.8.0",
    "scipy>=1.18.1",
    "torch>=2.15.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wevq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
